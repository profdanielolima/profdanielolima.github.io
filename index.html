<style>
  /* --------------------------------------------------------------
     PALETA — cores tiradas dos logos que você mandou.
     Para mudar o site inteiro de cor, basta trocar os códigos aqui.
     -------------------------------------------------------------- */
  :root{
    --azul:#21418E;          /* azul do CAp-UERJ  */
    --azul-claro:#0077BD;    /* azul da UERJ      */
    --vinho:#C31F26;         /* vermelho do CAp-UERJ */
    --ambar:#FFB806;         /* amarelo da Matemática Antirracista */
    --ambar-escuro:#8A6200;  /* o mesmo amarelo, escurecido para texto */
    --laranja:#EC6627;       /* laranja da tocha da UERJ */
    --tinta:#141414;
    --cinza:#5a5650;
    --linha:#e6e0d2;
    --papel:#FDFAF3;
    --branco:#ffffff;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--papel);color:var(--tinta);
    font-family:var(--sans);font-size:17px;line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 24px}

  /* ---------- cabeçalho ---------- */
  header.topo{background:var(--azul);color:#fff;padding:38px 0 0;
    border-top:6px solid var(--ambar)}
  header.topo h1{
    font-family:var(--serif);font-size:29px;line-height:1.25;
    margin:0 0 4px;font-weight:normal;letter-spacing:.2px;
  }
  header.topo .sub{color:#b9cbe4;font-size:15px;margin:0 0 26px}

  nav{border-top:1px solid rgba(255,255,255,.16)}
  nav ul{list-style:none;display:flex;flex-wrap:wrap;margin:0;padding:0}
  nav a{
    display:block;padding:13px 18px;color:#cbd9ea;text-decoration:none;
    font-size:14.5px;letter-spacing:.4px;border-bottom:3px solid transparent;
  }
  nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
  nav a.ativo{color:#fff;border-bottom-color:var(--ambar);font-weight:600}
  nav li:first-child a{padding-left:0}
  @media(max-width:560px){nav li:first-child a{padding-left:18px}}

  /* ---------- estrutura ---------- */
  main{padding:44px 0 70px;min-height:60vh}
  section[hidden]{display:none}
  h2.titulo{
    font-family:var(--serif);font-size:25px;font-weight:normal;
    margin:0 0 6px;color:var(--azul);
  }
  .legenda{color:var(--cinza);font-size:15px;margin:0 0 30px}
  h3{font-family:var(--serif);font-size:19px;color:var(--azul);margin:32px 0 10px;font-weight:normal}

  .cartao{
    background:var(--branco);border:1px solid var(--linha);border-radius:3px;
    padding:22px 24px;margin-bottom:16px;
  }

  /* ---------- avisos ---------- */
  .aviso{border-left:5px solid var(--ambar);background:var(--branco);
    border-top:1px solid var(--linha);border-right:1px solid var(--linha);
    border-bottom:1px solid var(--linha);border-radius:0 3px 3px 0;
    padding:18px 22px;margin-bottom:14px}
  .aviso .data{font-size:12.5px;color:var(--ambar-escuro);letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .aviso h4{margin:4px 0 6px;font-size:17.5px;font-family:var(--serif);font-weight:normal;color:var(--tinta)}
  .aviso p{margin:0;color:var(--cinza);font-size:16px}

  /* ---------- cartões de disciplina ---------- */
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  a.disc{
    display:block;text-decoration:none;color:inherit;background:var(--branco);
    border:1px solid var(--linha);border-top:4px solid var(--ambar);border-radius:3px;
    padding:22px 24px;transition:box-shadow .15s ease,transform .15s ease;
  }
  a.disc:hover{box-shadow:0 4px 16px rgba(33,65,142,.15);transform:translateY(-2px)}
  a.disc .cod{font-size:12.5px;letter-spacing:1.2px;color:var(--cinza);text-transform:uppercase}
  a.disc h4{font-family:var(--serif);font-size:19.5px;font-weight:normal;margin:5px 0 9px;color:var(--azul)}
  a.disc p{margin:0 0 14px;font-size:15px;color:var(--cinza)}
  a.disc .quando{font-size:14px;color:var(--tinta);border-top:1px solid var(--linha);padding-top:11px}
  a.disc .seta{color:var(--vinho);font-size:14px;margin-top:10px;display:block}

  /* ---------- ficha da disciplina ---------- */
  .voltar{display:inline-block;margin-bottom:18px;color:var(--vinho);
    text-decoration:none;font-size:14.5px}
  .voltar:hover{text-decoration:underline}
  .ficha{display:flex;flex-wrap:wrap;gap:10px 28px;padding:16px 0 20px;
    border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);margin-bottom:8px}
  .ficha div{font-size:14.5px}
  .ficha span{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza)}

  ul.lista{padding-left:20px;margin:0}
  ul.lista li{margin-bottom:7px}
  ol.refs{padding-left:20px;margin:0}
  ol.refs li{margin-bottom:9px;font-size:15.5px;line-height:1.55}

  table{width:100%;border-collapse:collapse;font-size:15.5px;background:var(--branco)}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--linha)}
  th{background:#F7F0DE;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ambar-escuro);font-weight:700;
     border-bottom:2px solid var(--ambar)}
  td:first-child{white-space:nowrap;color:var(--cinza);width:1%}
  tr.feriado td{background:#F6F2E8;color:var(--cinza);font-style:italic}
  tr.exame td{background:#FFF3D4;font-weight:700;color:var(--ambar-escuro)}
  tr.exame td:first-child{color:var(--ambar-escuro)}

  /* ---------- downloads ---------- */
  a.baixar{
    display:flex;align-items:center;gap:13px;background:var(--branco);
    border:1px solid var(--linha);border-radius:3px;padding:13px 17px;
    margin-bottom:9px;text-decoration:none;color:var(--tinta);font-size:16px;
  }
  a.baixar:hover{border-color:var(--ambar);background:#FFF9E9}
  a.baixar .ico{
    flex:0 0 30px;height:30px;border-radius:3px;background:var(--azul);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.5px;
  }
  a.baixar .ico.ext{background:var(--vinho)}
  a.baixar .seta2{margin-left:auto;color:var(--cinza);font-size:14px}

  /* ---------- sobre ---------- */
  .contato{list-style:none;padding:0;margin:0}
  .contato li{padding:11px 0;border-bottom:1px solid var(--linha);font-size:16px}
  .contato li b{display:inline-block;min-width:150px;color:var(--cinza);font-weight:600;font-size:14px}
  .botao{display:inline-block;margin-top:20px;background:var(--azul);color:#fff;
    text-decoration:none;padding:11px 22px;border-radius:3px;font-size:15px}
  .botao:hover{background:var(--azul-claro)}

  .vazio{color:var(--cinza);font-style:italic;font-size:15.5px}

  footer{border-top:4px solid var(--ambar);padding:26px 0 44px;
    color:var(--cinza);font-size:14px;background:#F7F1E2}

  @media print{
    header.topo{background:#fff;color:#000}
    nav,.voltar,footer{display:none}
    section[hidden]{display:block !important}
  }
</style>
</head>

        <li><a href="#/materiais">Materiais</a></li>
        <li><a href="#/avisos">Avisos</a></li>
        <li><a href="#/sobre">Sobre</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="wrap">
  <section id="pg-inicio"></section>
  <section id="pg-disciplinas" hidden></section>
  <section id="pg-ficha" hidden></section>
  <section id="pg-materiais" hidden></section>
  <section id="pg-avisos" hidden></section>
  <section id="pg-sobre" hidden></section>
</main>

<footer><div class="wrap" id="rodape"></div></footer>

<script>
(function(){
  "use strict";
  const C = window.CONFIG || {};
  const prof = C.professor || {};
  const discs = C.disciplinas || [];
  const avisos = C.avisos || [];

  // escapa texto para não quebrar o HTML se houver < ou &
  const e = t => String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const $ = id => document.getElementById(id);

  // Disciplinas que aparecem no site, guardando a posição original de cada
  // uma para os links não se embaralharem quando alguma estiver oculta.
  const visiveis = () => discs.map((d, i) => ({ d: d, i: i })).filter(x => !x.d.oculto);

  /* ---------- cabeçalho e rodapé ---------- */
  $("h-nome").textContent = prof.nome || "Disciplinas";
  $("h-sub").textContent  = [prof.cargo, prof.unidade].filter(Boolean).join(" · ");
  $("rodape").textContent = C.rodape || "";
  if (prof.nome) document.title = prof.nome + " — Disciplinas";

  /* ---------- helpers ---------- */
  function linkMaterial(m){
    const alvo = /^https?:\/\//i.test(m.arquivo || "") ? m.arquivo : "materiais/" + (m.arquivo || "");
    const externo = /^https?:\/\//i.test(m.arquivo || "");
    const ext = externo ? "LINK" : ((m.arquivo || "").split(".").pop() || "arq").toUpperCase().slice(0,4);
    return '<a class="baixar" href="' + e(alvo) + '" target="_blank" rel="noopener">' +
             '<span class="ico' + (externo ? " ext" : "") + '">' + e(ext) + '</span>' +
             '<span>' + e(m.titulo) + '</span>' +
             '<span class="seta2">' + (externo ? "abrir ↗" : "baixar ↓") + '</span>' +
           '</a>';
  }
  function blocoAviso(a){
    return '<article class="aviso"><div class="data">' + e(a.data) + '</div>' +
           '<h4>' + e(a.titulo) + '</h4><p>' + e(a.texto) + '</p></article>';
  }
  function cartaoDisc(d, i){
    return '<a class="disc" href="#/disciplina/' + i + '">' +
             '<div class="cod">' + e(d.codigo) + (d.periodo ? " · " + e(d.periodo) : "") + '</div>' +
             '<h4>' + e(d.nome) + '</h4>' +
             '<p>' + e(d.resumo) + '</p>' +
             ((d.horario || d.sala)
               ? '<div class="quando">' + e(d.horario || "") +
                 (d.horario && d.sala ? "<br>" : "") + e(d.sala || "") + '</div>'
               : "") +
             '<span class="seta">Ver a disciplina →</span>' +
           '</a>';
  }

  /* ---------- páginas ---------- */
  function pgInicio(){
    const recentes = avisos.slice(0,2).map(blocoAviso).join("") ||
      '<p class="vazio">Nenhum aviso no momento.</p>';
    const cartoes = visiveis().map(x => cartaoDisc(x.d, x.i)).join("");
    return '<h2 class="titulo">Bem-vindo</h2>' +
      '<p class="legenda">Aqui você encontra o programa, o cronograma e o material de apoio das disciplinas que ministro.</p>' +
      '<h3>Avisos recentes</h3>' + recentes +
      '<h3>Disciplinas neste período</h3>' +
      (cartoes ? '<div class="grade">' + cartoes + '</div>'
               : '<p class="vazio">Nenhuma disciplina neste período.</p>');
  }

  function pgDisciplinas(){
    const cartoes = visiveis().map(x => cartaoDisc(x.d, x.i)).join("");
    return '<h2 class="titulo">Disciplinas</h2>' +
      (cartoes
        ? '<p class="legenda">Clique em uma disciplina para ver ementa, cronograma, bibliografia e materiais.</p>' +
          '<div class="grade">' + cartoes + '</div>'
        : '<p class="vazio">Nenhuma disciplina neste período.</p>');
  }

  function pgFicha(i){
    const d = discs[i];
    if (!d) return '<h2 class="titulo">Disciplina não encontrada</h2>' +
                   '<a class="voltar" href="#/disciplinas">← Voltar</a>';

    let h = '<a class="voltar" href="#/disciplinas">← Todas as disciplinas</a>' +
      '<h2 class="titulo">' + e(d.nome) + '</h2>' +
      '<p class="legenda">' + e(d.codigo) + (d.turma ? " · " + e(d.turma) : "") + '</p>' +
      '<div class="ficha">' +
        (d.periodo ? '<div><span>Período</span>' + e(d.periodo) + '</div>' : "") +
        (d.horario ? '<div><span>Horário</span>' + e(d.horario) + '</div>' : "") +
        (d.sala    ? '<div><span>Local</span>'   + e(d.sala)    + '</div>' : "") +
      '</div>';

    if (d.ementa)  h += '<h3>Ementa</h3><p>' + e(d.ementa) + '</p>';
    if ((d.objetivos||[]).length)
      h += '<h3>Objetivos</h3><ul class="lista">' + d.objetivos.map(o => '<li>' + e(o) + '</li>').join("") + '</ul>';
    if (d.avaliacao) h += '<h3>Avaliação</h3><p>' + e(d.avaliacao) + '</p>';
    if ((d.cronograma||[]).length)
      h += '<h3>Cronograma de aulas</h3><table><thead><tr><th>Encontro</th><th>Tema</th></tr></thead><tbody>' +
           d.cronograma.map(a => '<tr' + (a.tipo ? ' class="' + e(a.tipo) + '"' : '') + '>' +
             '<td>' + e(a.data) + '</td><td>' + e(a.tema) + '</td></tr>').join("") +
           '</tbody></table>';
    if ((d.bibliografia||[]).length)
      h += '<h3>Bibliografia</h3><ol class="refs">' + d.bibliografia.map(b => '<li>' + e(b) + '</li>').join("") + '</ol>';
    if ((d.materiais||[]).length)
      h += '<h3>Materiais</h3>' + d.materiais.map(linkMaterial).join("");
    return h;
  }

  function pgMateriais(){
    const blocos = visiveis().filter(x => (x.d.materiais||[]).length).map(x =>
      '<h3>' + e(x.d.nome) + '</h3>' + x.d.materiais.map(linkMaterial).join("")).join("");
    return '<h2 class="titulo">Materiais</h2>' +
      '<p class="legenda">Slides, listas de exercícios e textos de apoio, organizados por disciplina.</p>' +
      (blocos || '<p class="vazio">Nenhum material disponível ainda.</p>');
  }

  function pgAvisos(){
    return '<h2 class="titulo">Avisos</h2>' +
      '<p class="legenda">Datas de prova, mudanças de sala e prazos.</p>' +
      (avisos.map(blocoAviso).join("") || '<p class="vazio">Nenhum aviso no momento.</p>');
  }

  function pgSobre(){
    const bio = (prof.bio||[]).map(p => '<p>' + e(p) + '</p>').join("");
    let contato = '<ul class="contato">';
    if (prof.email)       contato += '<li><b>E-mail</b> <a href="mailto:' + e(prof.email) + '">' + e(prof.email) + '</a></li>';
    if (prof.sala)        contato += '<li><b>Gabinete</b> ' + e(prof.sala) + '</li>';
    if (prof.atendimento) contato += '<li><b>Atendimento</b> ' + e(prof.atendimento) + '</li>';
    if (prof.unidade)     contato += '<li><b>Unidade</b> ' + e(prof.unidade) + '</li>';
    contato += '</ul>';
    const lattes = prof.lattes ? '<a class="botao" href="' + e(prof.lattes) + '" target="_blank" rel="noopener">Currículo Lattes ↗</a>' : "";
    return '<h2 class="titulo">Sobre</h2>' +
      '<p class="legenda">' + e(prof.nome) + (prof.cargo ? " · " + e(prof.cargo) : "") + '</p>' +
      bio + '<h3>Contato</h3>' + contato + lattes;
  }

  /* ---------- navegação ---------- */
  const secoes = ["inicio","disciplinas","ficha","materiais","avisos","sobre"];

  function mostrar(nome, html){
    secoes.forEach(s => { $("pg-" + s).hidden = (s !== nome); });
    $("pg-" + nome).innerHTML = html;
    document.querySelectorAll("nav a").forEach(a => {
      const alvo = nome === "ficha" ? "disciplinas" : nome;
      a.classList.toggle("ativo", a.getAttribute("href") === "#/" + alvo);
    });
  }

  function rotear(){
    const r = (location.hash || "#/inicio").replace(/^#\/?/, "").split("/");
    switch (r[0]) {
      case "disciplinas": return mostrar("disciplinas", pgDisciplinas());
      case "disciplina":  return mostrar("ficha", pgFicha(parseInt(r[1], 10)));
      case "materiais":   return mostrar("materiais", pgMateriais());
      case "avisos":      return mostrar("avisos", pgAvisos());
      case "sobre":       return mostrar("sobre", pgSobre());
      default:            return mostrar("inicio", pgInicio());
    }
  }

  window.addEventListener("hashchange", function(){ rotear(); window.scrollTo(0,0); });
  rotear();
})();
</script>

</body>
</html>
